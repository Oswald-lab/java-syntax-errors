plugins {
    id 'java'
    id 'application'
}

group = 'com.octiq.test'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.14.0'
}

application {
    mainClass = 'com.octiq.test.broken.Main'
}
